name: SS5 Quality Gate

on:
  push:
    branches:
      - thapelo-android-api-integration
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - 'mobile/**'
      - '.github/workflows/ss5-quality-gate.yml'
  pull_request:
    branches:
      - thapelo-android-api-integration
  workflow_dispatch:

jobs:
  web-tests:
    name: ASP.NET Core tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SportsManagementMVC.Tests/SportsManagementMVC.Tests.csproj

      - name: Run xUnit tests
        run: dotnet test SportsManagementMVC.Tests/SportsManagementMVC.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=ss5-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss5-web-test-results
          path: SportsManagementMVC.Tests/TestResults/**/*.trx
          if-no-files-found: ignore

  android-quality:
    name: Android unit tests and debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: mobile/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ss5-android-debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
