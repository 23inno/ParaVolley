name: Integration Fix Validation

on:
  push:
    branches:
      - chatgpt-integration-logic-fixes
    paths:
      - '**/*.cs'
      - '**/*.cshtml'
      - '**/*.csproj'
      - 'mobile/**'
      - '.github/workflows/integration-fix-validation.yml'

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend
        run: dotnet restore SportsManagementMVC.csproj

      - name: Build backend
        run: dotnet build SportsManagementMVC.csproj --configuration Release --no-restore

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: mobile/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Android debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
