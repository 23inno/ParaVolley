name: Publish APK Validation

on:
  push:
    branches:
      - chatgpt-publish-latest-player-apk
    paths:
      - 'mobile/**'
      - 'Views/Home/PublicHome.cshtml'
      - '.github/workflows/publish-apk-validation.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore SportsManagementMVC.csproj
      - name: Build
        run: dotnet build SportsManagementMVC.csproj --configuration Release --no-restore

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: mobile/**/*.gradle*
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build production-connected beta APK
        run: ./gradlew :app:assembleDebug --stacktrace
