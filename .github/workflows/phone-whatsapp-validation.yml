name: Phone WhatsApp Onboarding Validation

on:
  push:
    branches:
      - chatgpt-phone-whatsapp-onboarding
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore SportsManagementMVC.csproj
      - run: dotnet build SportsManagementMVC.csproj --configuration Release --no-restore

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: mobile/**/*.gradle*
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug --stacktrace
