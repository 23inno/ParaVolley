name: Player Approval Onboarding Validation

on:
  push:
    branches:
      - chatgpt-player-approval-onboarding
    paths:
      - '**/*.cs'
      - '**/*.cshtml'
      - '**/*.csproj'
      - 'appsettings.json'
      - '.github/workflows/player-approval-onboarding-validation.yml'

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SportsManagementMVC.csproj

      - name: Build
        run: dotnet build SportsManagementMVC.csproj --configuration Release --no-restore
