name: Forgot Password Feedback Validation

on:
  push:
    branches:
      - chatgpt-forgot-password-feedback
    paths:
      - '**/*.cs'
      - '**/*.cshtml'
      - '**/*.csproj'
      - '.github/workflows/forgot-password-feedback-validation.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore SportsManagementMVC.csproj
      - name: Build
        run: dotnet build SportsManagementMVC.csproj --configuration Release --no-restore
