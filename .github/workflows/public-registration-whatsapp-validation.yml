name: Public Registration WhatsApp Validation

on:
  push:
    branches:
      - chatgpt-public-registration-whatsapp-fix
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore SportsManagementMVC.csproj
      - run: dotnet build SportsManagementMVC.csproj --configuration Release --no-restore
